name: Daily X Tweets

# Posts 3 cards/day from the latest board to @dollarbetslol on X.
#
# Every scheduled run does the same thing (`--mode run`):
#   1. If there is no queue file for the latest board yet, ask Claude to pick
#      two board cards; the day's filthy little longshot is always slot 3.
#   2. Post the next slot that hasn't gone out yet. Nothing left = no-op.
#
# So the slot is decided by queue state, not by the runner's clock. GitHub
# cron routinely fires 10–60+ minutes late (the old hour→slot mapping silently
# fell through to dry-run when it did — same bug that starved the prediction
# board in September). Three fires a day = three posts a day, whenever they land.
#
# Schedule (UTC → US Eastern, EDT):
#   12:30 UTC = 8:30am ET — morning pick  (tile card)
#   16:30 UTC = 12:30pm ET — lunch pick    (tile card)
#   00:30 UTC = 8:30pm ET  — the longshot  (dark ticket)
# Evening is where betting Twitter lives; the longshot gets that slot.
#
# The 08:00 UTC board scan + Vercel rebuild have long finished by 12:30, so
# /share/{ticker}/card.png exists before the first post pulls it.
#
# DRY-RUN BY DEFAULT. Repo variable TWEET_LIVE=1 makes it post for real.
# (A repo *variable*, not a secret — secrets can't be compared in a workflow
# without leaking, and "1" isn't sensitive.)

on:
  schedule:
    - cron: '30 12,16 * * *'
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which step to run'
        type: choice
        options: [run, select-only, dry-run-all]
        default: run
      live:
        description: 'Override TWEET_LIVE for this manual run'
        type: choice
        options: ['inherit', '0', '1']
        default: inherit

permissions:
  contents: write

concurrency:
  group: social-queue
  cancel-in-progress: false

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Full history so the queue commit can rebase over a concurrent
          # daily-scan commit instead of conflicting.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet tweepy

      - name: Resolve mode + live flag
        id: cfg
        run: |
          MODE="${{ github.event.inputs.mode }}"
          [ -z "$MODE" ] && MODE="run"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          # TWEET_LIVE resolution: manual override > repo variable > 0
          LIVE_OVERRIDE="${{ github.event.inputs.live }}"
          if [ "$LIVE_OVERRIDE" = "0" ] || [ "$LIVE_OVERRIDE" = "1" ]; then
            LIVE="$LIVE_OVERRIDE"
          else
            LIVE="${{ vars.TWEET_LIVE || '0' }}"
          fi
          echo "live=$LIVE" >> "$GITHUB_OUTPUT"
          echo "Resolved mode=$MODE  live=$LIVE"

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          TWEET_LIVE: ${{ steps.cfg.outputs.live }}
          TWEET_LINK_MODE: ${{ vars.TWEET_LINK_MODE || 'reply' }}
        run: |
          set -e
          case "${{ steps.cfg.outputs.mode }}" in
            run)
              python3 scripts/daily_tweets.py --mode run
              ;;
            select-only)
              python3 scripts/daily_tweets.py --mode select
              ;;
            dry-run-all)
              # Compose all three without posting; the queue file records them.
              TWEET_LIVE=0 python3 scripts/daily_tweets.py --mode select
              TWEET_LIVE=0 python3 scripts/daily_tweets.py --mode post --slot 1
              TWEET_LIVE=0 python3 scripts/daily_tweets.py --mode post --slot 2
              TWEET_LIVE=0 python3 scripts/daily_tweets.py --mode post --slot 3
              ;;
          esac

      - name: Commit queue file
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/social-queue/)" ]; then
            echo "No queue changes to commit"
            exit 0
          fi
          git config user.name "dollarbets-bot"
          git config user.email "bot@dollarbets.lol"
          git add data/social-queue/
          git commit -m "tweet queue: ${{ steps.cfg.outputs.mode }} $(date -u +%Y-%m-%dT%H:%MZ)"
          # Rebase over any concurrent daily-scan commit, then push
          git pull --rebase origin main
          git push origin HEAD:main
