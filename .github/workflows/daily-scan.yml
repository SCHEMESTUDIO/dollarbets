name: Daily Board Scan

on:
  schedule:
    # Three runs/day (cut from six 2026-07-20, cost audit). Morning slot is 08:00 UTC = 9am London during BST
    # (will read as 8am London during GMT — accepted tradeoff vs the
    # complexity of a DST-aware check).
    # 08:00 UTC triggers the daily prediction-market scan (Kalshi/Polymarket).
    # The other five slots cover US peak hours for sports/combo refreshes.
    # ~600 Odds API tokens/day total, well inside monthly budget.
    - cron: '0 8,16,22 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run prediction market scanner (daily only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p data/boards
          HOUR=$(date -u +%H)
          TODAY=$(date -u +%Y-%m-%d)
          # Only run prediction market scan at 08:00 UTC (9am London BST) or on manual trigger
          if [ "$HOUR" != "08" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Skipping prediction market scan (hourly run, not 08:00 UTC)"
            exit 0
          fi
          if [ -f "data/boards/${TODAY}.json" ]; then
            echo "Board for ${TODAY} already exists — skipping scan to preserve manual edits"
            exit 0
          fi
          echo "Scanning markets for ${TODAY}..."
          python3 scanner.py > "data/boards/${TODAY}.json"
          echo "Board saved to data/boards/${TODAY}.json"

          # Validate: board must have markets, valid JSON, working URLs
          python3 -c "
          import sys, json, urllib.request, urllib.error, re

          with open('data/boards/${TODAY}.json') as f:
              d = json.load(f)
          board = d.get('board', [])
          count = len(board)
          mix = d.get('platform_mix', {})
          print(f'{count} markets on board — mix: {mix}')
          if count < 5:
              print('ERROR: Board has fewer than 5 markets — aborting deploy')
              sys.exit(1)

          # Check all markets have required fields
          for m in board:
              assert m.get('title'), f'Missing title: {m}'
              assert m.get('url'), f'Missing url: {m}'
              assert m.get('payout'), f'Missing payout: {m}'

          # Spot-check: verify Polymarket URLs resolve in Gamma API
          poly_markets = [m for m in board if m.get('platform') == 'polymarket']
          bad = 0
          for m in poly_markets:
              url = m['url']
              match = re.search(r'polymarket\.com/event/([^/?#]+)', url)
              if not match:
                  print(f'WARN: Bad Polymarket URL format: {url}')
                  bad += 1
                  continue
              slug = match.group(1)
              try:
                  api = f'https://gamma-api.polymarket.com/events?slug={slug}&limit=1'
                  req = urllib.request.Request(api, headers={'Accept':'application/json','User-Agent':'DollarBets/1.0'})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read().decode())
                      if not (isinstance(data, list) and len(data) > 0):
                          print(f'WARN: Polymarket slug not found: {slug} ({url})')
                          bad += 1
                      else:
                          print(f'OK: {slug}')
              except Exception as e:
                  print(f'WARN: Could not verify {slug}: {e}')

          if bad > 0:
              print(f'WARNING: {bad} Polymarket URL(s) may be broken — board deployed anyway')

          print('Board validation passed')
          "

      - name: Run sports scanners (all boards)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [ -z "$ODDS_API_KEY" ]; then
            echo "ODDS_API_KEY not set — skipping all sports scans"
          else
            # Run each board mode — sports boards always refresh (hourly)
            for MODE in lineup underdogs ocho chalk; do
              PREFIX=""
              case $MODE in
                lineup) PREFIX="sports" ;;
                *) PREFIX="$MODE" ;;
              esac
              OUTFILE="data/boards/${PREFIX}-${TODAY}.json"
              echo "Scanning ${MODE} board..."
              python3 sports_scanner.py --board=${MODE} > "${OUTFILE}" || {
                echo "${MODE} scanner failed — removing partial output"
                rm -f "${OUTFILE}"
                continue
              }
              if [ -f "${OUTFILE}" ]; then
                python3 -c "
          import sys, json
          with open('${OUTFILE}') as f:
              d = json.load(f)
          board = d.get('board', [])
          print(f'${MODE} board: {len(board)} picks')
          # Allow empty boards for ocho (obscure sports may not always be in season)
          if len(board) < 1 and '${MODE}' != 'ocho':
              print('ERROR: ${MODE} board is empty — removing')
              sys.exit(1)
          for m in board:
              assert m.get('title'), f'Missing title: {m}'
              assert m.get('payout'), f'Missing payout: {m}'
          print('${MODE} board validation passed')
                " || rm -f "${OUTFILE}"
              fi
            done
          fi

      - name: Run combo meal scanner (parlays)
        # Combo step has historically hung on high-game days (combinations
        # explosion in build_parlays). Cap runtime and never block the commit
        # step on it — existing combo board persists if today's run fails.
        timeout-minutes: 4
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [ -z "$ODDS_API_KEY" ]; then
            echo "ODDS_API_KEY not set — skipping combo meal scan"
          else
            OUTFILE="data/boards/combo-${TODAY}.json"
            TMPFILE="data/boards/combo-${TODAY}.json.tmp"
            echo "Scanning combo meal (parlays)..."
            # Write to a tmp file first so a mid-flight crash doesn't truncate
            # an existing good board. Validate before promoting.
            if python3 parlay_scanner.py > "${TMPFILE}"; then
              # Sanity: must be parseable JSON with the expected shape.
              python3 -c "
          import sys, json
          try:
              with open('${TMPFILE}') as f:
                  d = json.load(f)
          except Exception as e:
              print(f'ERROR: combo board did not parse as JSON: {e}')
              sys.exit(1)
          board = d.get('board', [])
          tier_mix = d.get('tier_mix', {})
          sport_mix = d.get('sport_mix', {})
          print(f'combo board: {len(board)} parlays — tiers: {tier_mix}, sports: {sport_mix}')
          if len(board) == 0:
              # Empty is allowed (no qualifying parlays today) — we still want
              # the file committed so /combo-meal/ renders an empty-state page
              # rather than a stale board.
              print('NOTE: combo board is empty today (no parlays met criteria)')
          for m in board:
              assert m.get('title'), f'parlay missing title: {m}'
              assert m.get('payout'), f'parlay missing payout: {m}'
              assert m.get('ticker','').startswith('PARLAY-'), f'bad ticker: {m}'
          print('combo board validation passed')
              " && mv "${TMPFILE}" "${OUTFILE}" || {
                echo "Combo board validation failed — discarding tmp output"
                rm -f "${TMPFILE}"
              }
            else
              echo "Parlay scanner exited non-zero — discarding tmp output"
              echo "(check stderr above for the actual error)"
              rm -f "${TMPFILE}"
            fi
          fi

      - name: Commit and push
        id: commit
        run: |
          git config user.name "Dollar Bets Bot"
          git config user.email "bot@dollarbets.lol"
          git add data/boards/
          if git diff --staged --quiet; then
            echo "No new data to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            TODAY=$(date -u +%Y-%m-%d)
            HOUR=$(date -u +%H)
            git commit -m "board update: ${TODAY} ${HOUR}:00 UTC"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Vercel deploy
        if: steps.commit.outputs.changed == 'true'
        run: |
          echo "Triggering Vercel deploy..."
          curl -sS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" -o /dev/null 2>&1 \
            || echo "WARNING: Vercel deploy hook failed"
          echo "Deploy triggered."
