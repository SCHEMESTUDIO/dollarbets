name: Weekly Taste Analysis

on:
  schedule:
    # Every Sunday at 6am UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:  # Allow manual trigger

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check for overrides
        id: check
        run: |
          if [ -f data/quip-overrides.json ]; then
            COUNT=$(python3 -c "import json; print(len(json.load(open('data/quip-overrides.json'))))" 2>/dev/null || echo "0")
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            echo "Found $COUNT editor overrides"
          else
            echo "count=0" >> $GITHUB_OUTPUT
            echo "No overrides file found"
          fi

      - name: Run taste analysis
        if: steps.check.outputs.count >= 5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 analyze_taste.py

      - name: Commit style guide
        if: steps.check.outputs.count >= 5
        run: |
          git config user.name "Dollar Bets Bot"
          git config user.email "bot@dollarbets.lol"
          git add data/style-guide.json
          if git diff --staged --quiet; then
            echo "No changes to style guide"
          else
            git commit -m "taste: update editorial style guide ($(date -u +%Y-%m-%d))"
            git push
          fi
